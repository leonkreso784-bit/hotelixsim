name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hotelixsim
          POSTGRES_PASSWORD: hotelixsim_lokalno
          POSTGRES_DB: hotelixsim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotelixsim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hotelixsim:hotelixsim_lokalno@localhost:5432/hotelixsim
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: node scripts/check-core-deps.mjs
      - run: node scripts/probe-mutacija.mjs
      - run: git diff --exit-code
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres --locked
      # prepare --check traži bazu s primijenjenim migracijama
      - run: cargo sqlx migrate run --source crates/store/migrations
      - run: cargo sqlx prepare --workspace --check
      - run: cargo test --workspace
      - run: cargo run -q -p balance --release -- --seeds 100 --check
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: pnpm test:docs
      - run: pnpm check:api
        env: { SQLX_OFFLINE: "true" }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
