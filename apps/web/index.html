<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-znak.png" />
    <meta name="theme-color" content="#246BFD" />
    <title>HotelixSim</title>
    <style>
      /* Uvod: logo se gradi dok se aplikacija učitava. Izlaz vodi src/splash.ts.
         Boje su prijepis tokena iz src/styles.css (--color-canvas, --color-ink, --color-accent) jer ovaj stil ne
         smije ovisiti o njemu. U razvoju se uvod crta prije styles.css; u produkciji Vite stavi index-*.css u <head>
         pa se uvod crta tek kad on stigne — zato se vrijeme uvoda broji od prvog crtanja (data-start), ne od učitavanja. */
      .hx-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: #f5f8fd;
      }
      .hx-stage {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      .hx-logo {
        width: 116px;
        height: 116px;
        overflow: visible;
      }
      @media (min-width: 768px) {
        .hx-logo {
          width: 136px;
          height: 136px;
        }
      }
      .hx-word {
        margin: 0;
        /* Sistemski dio --font-sans: Plus Jakarta stiže tek sa styles.css i zamijenio bi slova usred uvoda. */
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #151b2b;
      }
      .hx-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .hx-logo * {
        transform-box: fill-box;
      }
      /* Redom: pločica, dva stupa i prečka (H), pročelje s lučnim ulazom, stepenice, vrata se otvaraju, svjetlo. */
      .hx-tile {
        transform-origin: center;
        animation: hx-tile 0.46s cubic-bezier(0.34, 1.5, 0.64, 1) both;
      }
      .hx-shadow {
        animation: hx-fade 0.6s ease-out 0.1s both;
      }
      .hx-pl {
        transform-origin: 50% 100%;
        animation: hx-grow-y 0.5s cubic-bezier(0.2, 0.9, 0.25, 1) 0.18s both;
      }
      .hx-pr {
        transform-origin: 50% 100%;
        animation: hx-grow-y 0.5s cubic-bezier(0.2, 0.9, 0.25, 1) 0.27s both;
      }
      .hx-bar {
        transform-origin: 0% 50%;
        animation: hx-grow-x 0.3s cubic-bezier(0.3, 0.8, 0.3, 1) 0.62s both;
      }
      .hx-face {
        transform-origin: 50% 0%;
        animation: hx-grow-y 0.42s cubic-bezier(0.2, 0.9, 0.25, 1) 1.02s both;
      }
      .hx-flare {
        animation: hx-fade 0.3s ease-out 1.1s both;
      }
      /* Vrata na šarki lijevo; osnovni stil je završno stanje (otvorena), da ga vide i smanjeni pokreti. */
      .hx-door {
        fill: #cfe0ff;
        transform-origin: 0% 50%;
        transform: scaleX(0.37);
        animation:
          hx-fade 0.2s ease-out 1.2s both,
          hx-door-open 0.62s cubic-bezier(0.65, 0, 0.25, 1) 1.62s both;
      }
      .hx-s1 {
        animation: hx-step 0.32s cubic-bezier(0.2, 0.9, 0.25, 1) 1.26s both;
      }
      .hx-s2 {
        animation: hx-step 0.32s cubic-bezier(0.2, 0.9, 0.25, 1) 1.36s both;
      }
      .hx-light {
        animation:
          hx-fade 0.7s ease-out 1.68s both,
          hx-breathe 2.4s ease-in-out 2.6s infinite;
      }
      .hx-spill {
        opacity: 0.9;
        animation: hx-spill 0.7s ease-out 1.78s both;
      }
      .hx-word {
        animation: hx-word 0.5s cubic-bezier(0.2, 0.9, 0.25, 1) 1.95s both;
      }

      @keyframes hx-tile {
        from {
          opacity: 0;
          transform: scale(0.72);
        }
      }
      @keyframes hx-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes hx-grow-y {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes hx-grow-x {
        from {
          transform: scaleX(0);
        }
      }
      @keyframes hx-step {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
      }
      @keyframes hx-spill {
        from {
          opacity: 0;
          transform: scaleY(0.4);
        }
      }
      @keyframes hx-door-open {
        from {
          fill: #9dbfff;
          transform: none;
        }
      }
      @keyframes hx-breathe {
        50% {
          opacity: 0.78;
        }
      }
      @keyframes hx-word {
        from {
          opacity: 0;
          transform: translateY(6px);
          letter-spacing: 0.04em;
        }
      }

      /* Izlaz (src/splash.ts, SPLASH_FADE_MS = 0,32 s): prvo nestane logo s imenom, tek onda podloga —
         logo uvoda i logo početnog ekrana nikad se ne vide jedan preko drugog. */
      .hx-splash.is-leaving {
        animation: hx-leave 0.32s ease-out forwards;
      }
      .hx-splash.is-leaving .hx-stage {
        animation: hx-out 0.14s ease-out forwards;
      }
      @keyframes hx-leave {
        0%,
        45% {
          opacity: 1;
        }
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @keyframes hx-out {
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hx-logo *,
        .hx-word,
        .hx-splash.is-leaving,
        .hx-splash.is-leaving .hx-stage {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="hx-splash" id="hx-splash" role="status">
      <span class="hx-sr">Učitavam HotelixSim</span>
      <div class="hx-stage" aria-hidden="true">
        <svg class="hx-logo" viewBox="0 0 128 128" aria-hidden="true">
          <defs>
            <radialGradient id="hx-light-g" cx="0.5" cy="0.62" r="0.62">
              <stop offset="0" stop-color="#fffaf0" />
              <stop offset="0.55" stop-color="#ffe3a6" />
              <stop offset="1" stop-color="#ffc56b" />
            </radialGradient>
            <linearGradient id="hx-spill-g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe3a6" stop-opacity="0.95" />
              <stop offset="1" stop-color="#ffe3a6" stop-opacity="0" />
            </linearGradient>
            <filter id="hx-blur" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="6" />
            </filter>
            <!-- Otvor vrata: luk gore, pri dnu se širi prema stepenicama. -->
            <mask id="hx-door-hole" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
              <rect width="128" height="128" fill="#fff" />
              <path d="M50 94 V73.5 A14 14 0 0 1 78 73.5 V94 Z" fill="#000" />
              <path class="hx-flare" d="M50 93 C50 98 43 101 32 103 H96 C85 101 78 98 78 93 Z" fill="#000" />
            </mask>
            <clipPath id="hx-arch">
              <path d="M50 94 V73.5 A14 14 0 0 1 78 73.5 V94 Z" />
            </clipPath>
          </defs>

          <g class="hx-tile">
            <rect class="hx-shadow" x="6" y="12" width="116" height="116" rx="30" fill="#246bfd" opacity="0.18" filter="url(#hx-blur)" />
            <!-- #246bfd = --color-accent: ista jednolična boja kao logo na početnom ekranu. -->
            <rect width="128" height="128" rx="30" fill="#246bfd" />
          </g>

          <g clip-path="url(#hx-arch)">
            <rect class="hx-light" x="50" y="59" width="28" height="36" fill="url(#hx-light-g)" />
          </g>

          <g mask="url(#hx-door-hole)" fill="#fff">
            <path class="hx-pl" d="M30 23 L48 30 V103 H30 Z" />
            <path class="hx-pr" d="M80 30 L98 23 V103 H80 Z" />
            <rect class="hx-bar" x="47.5" y="48" width="33" height="10.5" />
            <rect class="hx-face" x="47.5" y="58" width="33" height="45" />
          </g>

          <path class="hx-spill" d="M50 94 H78 L90 108 H38 Z" fill="url(#hx-spill-g)" />
          <rect class="hx-s1" x="50" y="97" width="28" height="4" rx="1.5" fill="#cfe0ff" />
          <rect class="hx-s2" x="43" y="104" width="42" height="4.5" rx="1.8" fill="#a9c6ff" />

          <path class="hx-door" d="M50.5 94 L50.5 73.5 C50.5 66 56.5 60 64 60 C71.5 60 77.5 66 77.5 73.5 L77.5 94 Z" />
        </svg>
        <p class="hx-word">HotelixSim</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Uvod jednom po kartici (ključ SPLASH_SEEN_KEY u src/splash.ts); `?uvod` ili `?uvod=1` ga uvijek pokaže.
      // Stoji iza #root da ga može učiniti nedostupnim (inert) dok je uvod na ekranu.
      (() => {
        var splash = document.getElementById("hx-splash");
        var root = document.getElementById("root");
        var uvod = new URLSearchParams(location.search).get("uvod");
        try {
          if (uvod !== "" && uvod !== "1" && sessionStorage.getItem("hx-uvod")) {
            splash.remove();
            return;
          }
        } catch {}
        root.setAttribute("inert", "");
        // Prvo crtanje uvoda: odavde src/splash.ts broji SPLASH_MIN_MS, a ovdje teče sigurnosni rok —
        // ako se aplikacija ne učita za 9 s, uvod izblijedi i ode sam (blijeđenje samo jednom, vidi splash.ts).
        requestAnimationFrame((t) => {
          splash.dataset.start = String(t);
          setTimeout(() => {
            if (!splash.isConnected || splash.classList.contains("is-leaving")) return;
            splash.classList.add("is-leaving");
            setTimeout(() => {
              splash.remove();
              root.removeAttribute("inert");
            }, 320);
          }, 9000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
