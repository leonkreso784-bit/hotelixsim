name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hotelixsim
          POSTGRES_PASSWORD: hotelixsim_lokalno
          POSTGRES_DB: hotelixsim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotelixsim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hotelixsim:hotelixsim_lokalno@localhost:5432/hotelixsim
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: node scripts/check-core-deps.mjs
      - run: node scripts/probe-mutacija.mjs
      - run: git diff --exit-code
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres --locked
      # prepare --check traži bazu s primijenjenim migracijama
      - run: cargo sqlx migrate run --source crates/store/migrations
      - run: cargo sqlx prepare --workspace --check
      - run: cargo test --workspace
      - run: cargo run -q -p balance --release -- --seeds 100 --check
      - run: cargo run -q -p balance --release -- --model v2 --round week --seeds 1000 --check
      - run: cargo run -q -p balance --release -- --model v2 --round month --seeds 1000 --check
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: pnpm test:docs
      - run: pnpm check:kod
      - run: pnpm check:api
        env: { SQLX_OFFLINE: "true" }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @hotelixsim/web build

  # Slika za pilot (Dockerfile): samo gradnja i dimni test, bez objave. Zaseban posao, teče usporedo s ostalima.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: hotelixsim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # `server openapi` ne treba bazu: dokaz da binarna u slici radi i da je API isti kao u repou.
      - name: Binarna u slici daje isti openapi.json
        run: |
          docker run --rm hotelixsim:ci server openapi > "$RUNNER_TEMP/openapi.json"
          cmp "$RUNNER_TEMP/openapi.json" openapi.json
